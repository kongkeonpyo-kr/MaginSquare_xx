[project]
name = "magicsquare-xx"
version = "0.1.0"
description = "4x4 Magic Square — ECB + Dual-Track TDD"
readme = "docs/PRD.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "entity: Logic Track — Entity (test_d_* in tests/entity/)",
    "control: Logic Track — Control (test_d_* in tests/control/)",
    "boundary: UI Track — Boundary (test_u_* in tests/boundary/)",
]
